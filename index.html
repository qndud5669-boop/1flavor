<style>
  :root {
    --bg: #F0F4FC;
    --surface: #FFFFFF;
    --surface-2: #F7FAFF;
    --text: #131B33;
    --text-muted: #5B6580;
    --border: #DCE4F5;
    --accent: #1957E8;
    --accent-soft: #E4ECFD;
    --critical: #E0272B;
    --critical-soft: #FCE5E5;
    --warning: #B8860B;
    --warning-soft: #F7EDD2;
    --ok: #1C9A5B;
    --ok-soft: #E0F5E9;
    --shadow: 0 1px 2px rgba(19, 27, 51, .06), 0 1px 1px rgba(19, 27, 51, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A1122;
      --surface: #10192F;
      --surface-2: #15213C;
      --text: #E8EDFC;
      --text-muted: #8D98B8;
      --border: #253150;
      --accent: #5286FF;
      --accent-soft: #16274E;
      --critical: #FF6B6B;
      --critical-soft: #3A1518;
      --warning: #E0B84D;
      --warning-soft: #3A2F12;
      --ok: #4FD891;
      --ok-soft: #123321;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1122; --surface: #10192F; --surface-2: #15213C; --text: #E8EDFC; --text-muted: #8D98B8;
    --border: #253150; --accent: #5286FF; --accent-soft: #16274E; --critical: #FF6B6B; --critical-soft: #3A1518;
    --warning: #E0B84D; --warning-soft: #3A2F12; --ok: #4FD891; --ok-soft: #123321;
  }
  :root[data-theme="light"] {
    --bg: #F0F4FC; --surface: #FFFFFF; --surface-2: #F7FAFF; --text: #131B33; --text-muted: #5B6580;
    --border: #DCE4F5; --accent: #1957E8; --accent-soft: #E4ECFD; --critical: #E0272B; --critical-soft: #FCE5E5;
    --warning: #B8860B; --warning-soft: #F7EDD2; --ok: #1C9A5B; --ok-soft: #E0F5E9;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
                 "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; display: none; }
  .wrap.unlocked { display: block; }

  #loginGate {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); z-index: 100; padding: 20px;
  }
  #loginGate.hidden { display: none; }
  .login-card {
    width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px 28px; box-shadow: var(--shadow);
  }
  .login-card .eyebrow { margin-bottom: 8px; }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card .subtitle { margin-bottom: 22px; }
  .login-field { margin-bottom: 12px; }
  .login-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
  .login-field input {
    width: 100%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  .login-field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .login-submit {
    width: 100%; border: none; background: var(--accent); color: #fff; font-weight: 700;
    font-size: 14px; padding: 11px; border-radius: 8px; cursor: pointer; margin-top: 6px;
  }
  .login-submit:hover { opacity: .92; }
  .login-error { color: var(--critical); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  header.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
  .meta { text-align: right; font-size: 12px; color: var(--text-muted); line-height: 1.6; }

  .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 28px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--stripe, var(--border)); }
  .kpi[data-kind="urgent"] { --stripe: var(--critical); }
  .kpi[data-kind="review"] { --stripe: var(--warning); }
  .kpi[data-kind="secured"] { --stripe: var(--accent); }
  .kpi[data-kind="ok"] { --stripe: var(--ok); }
  .kpi[data-kind="total"] { --stripe: var(--accent); }
  .kpi-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .kpi-value { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .kpi-value .unit { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-left: 2px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; }
  .tab {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .search-box {
    border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
    padding: 7px 12px; font-size: 13px; color: var(--text); min-width: 220px;
  }
  .search-box:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px 14px 14px; box-shadow: var(--shadow); display: grid;
    grid-template-columns: 4px minmax(0,1.7fr) minmax(0,1.1fr) minmax(0,.9fr) auto;
    gap: 16px; align-items: center;
  }
  .row .stripe { align-self: stretch; border-radius: 3px; background: var(--border); }
  .row[data-priority="긴급"] .stripe { background: var(--critical); }
  .row[data-priority="아이템위너"] .stripe { background: var(--warning); }
  .row[data-priority="설정완료"] .stripe { background: var(--accent); }
  .row[data-priority="매핑필요"] .stripe { background: var(--text-muted); }
  .row[data-priority=""] .stripe { background: var(--ok); }

  document.getElementById("generatedAt").textContent = new Date().toLocaleString("ko-KR");

  const AUTH_ID = "echungwoo";
  const AUTH_PW = "dlcjddn1004!";
  const SESSION_KEY = "cw_dashboard_auth";

  function unlock() {
    document.getElementById("loginGate").classList.add("hidden");
    document.getElementById("app").classList.add("unlocked");
  }

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    unlock();
  }

  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("loginId").value.trim();
    const pw = document.getElementById("loginPw").value;
    if (id === AUTH_ID && pw === AUTH_PW) {
      sessionStorage.setItem(SESSION_KEY, "1");
      unlock();
    } else {
      document.getElementById("loginError").textContent = "아이디 또는 비밀번호가 올바르지 않습니다.";
    }
  });

  const fmt = (n) => n == null ? "-" : n.toLocaleString("ko-KR");

  function kpi(kind, label, value, unit) {
    return `<div class="kpi" data-kind="${kind}"><div class="kpi-label">${label}</div>` +
      `<div class="kpi-value">${value}<span class="unit">${unit || ""}</span></div></div>`;
  }

  function renderKpis() {
    const total = DATA.length;
    const urgent = DATA.filter(d => d.priority === "긴급").length;
    const itemWinner = DATA.filter(d => d.priority === "아이템위너").length;
    const secured = DATA.filter(d => d.priority === "설정완료").length;
    const ok = DATA.filter(d => d.status === "정상").length;
    document.getElementById("kpiRow").innerHTML = [
      kpi("total", "총 검사 품목", fmt(total), "건"),
      kpi("urgent", "오매칭 의심 (경쟁사 매칭)", fmt(urgent), "건"),
      kpi("review", "아이템위너 설정필요", fmt(itemWinner), "건"),
      kpi("secured", "아이템위너 설정완료", fmt(secured), "건"),
      kpi("ok", "정상", fmt(ok), "건"),
    ].join("");
  }

  function priorityPill(item) {
    if (item.priority === "긴급") return `<span class="pill critical">긴급</span>`;
    if (item.priority === "아이템위너") return `<span class="pill warning">아이템위너 설정필요</span>`;
    if (item.priority === "설정완료") return `<span class="pill" style="background:var(--accent-soft);color:var(--accent);">설정완료</span>`;
    if (item.priority === "매핑필요") return `<span class="pill">매핑필요</span>`;
    return `<span class="pill ok">정상</span>`;
  }

  function reasonTags(item) {
    if (!item.detail) return "";
    const parts = item.detail.split(" / ").filter(Boolean);
    const tags = parts.map(p => {
      const cls = p.startsWith("[긴급]") ? "reason-tag critical" : "reason-tag";
      return `<span class="${cls}">${escapeHtml(p)}</span>`;
    }).join("");
    return `<div class="detail-line"><div class="reason-tags">${tags}</div></div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderRow(item) {
    const isRival = item.priority === "긴급";
    const gap = item.gapPct != null
      ? `<div class="gap">경쟁사 대비 +${item.gapPct}% (${fmt(item.rivalPrice)}원, ${escapeHtml(item.rivalName)})</div>`
      : `<div class="gap none">경쟁사 미노출</div>`;
    const rocket = item.rocket === "Y" ? "로켓배송 O" : "로켓배송 X";
    return `
      <div class="row" data-priority="${item.priority}">
        <div class="stripe"></div>
        <div class="prod-cell">
          <div class="prod-name">${escapeHtml(item.keyword)}</div>
          <div class="prod-query">검색어: "${escapeHtml(item.searchQuery)}" · 리뷰 ${fmt(item.reviewCount)}개 · 평점 ${item.rating || "-"}</div>
        </div>
        <div class="brand-cell ${isRival ? "is-rival" : ""}">
          ${priorityPill(item)}
          <div class="found">${escapeHtml(item.foundBrand || "(표시 없음)")}</div>
          <div class="rocket">${rocket}${item.outOfStock === "Y" ? " · 품절" : ""}</div>
        </div>
        <div class="price-cell">
          <div class="own">${item.price ? fmt(item.price) + "원" : "-"}</div>
          ${gap}
        </div>
        <div class="actions">
          ${renderActions(item, isRival)}
        </div>
        ${reasonTags(item)}
      </div>`;
  }

  function renderActions(item, isRival) {
    const sameAsTop = item.ownUrl && item.ownUrl === item.url;
    const btns = [];
    if (item.ownUrl) {
      btns.push(`<a class="btn-link primary" href="${item.ownUrl}" target="_blank" rel="noopener">우리 상품 보기</a>`);
    } else {
      btns.push(`<span class="btn-link" style="opacity:.55;cursor:default;">우리 상품 미확인</span>`);
    }
    if (!sameAsTop) {
      const label = isRival ? "경쟁사 매칭 확인" : "현재 매칭 상품";
      btns.push(`<a class="btn-link" href="${item.url}" target="_blank" rel="noopener">${label}</a>`);
    }
    if (!isRival && item.rivalUrl) {
      btns.push(`<a class="btn-link" href="${item.rivalUrl}" target="_blank" rel="noopener">경쟁상품 보기</a>`);
    }
    return btns.join("");
  }

  let currentFilter = "all";
  let currentQuery = "";

  function applyFilter() {
    let rows = DATA;
    if (currentFilter !== "all") {
      rows = rows.filter(d => currentFilter === "정상" ? d.status === "정상" : d.priority === currentFilter);
    }
    if (currentQuery) {
      const q = currentQuery.toLowerCase();
      rows = rows.filter(d => d.keyword.toLowerCase().includes(q));
    }
    const priorityOrder = { "긴급": 0, "아이템위너": 1, "": 2, "설정완료": 3, "매핑필요": 4 };
    rows = [...rows].sort((a, b) => (priorityOrder[a.priority] ?? 2) - (priorityOrder[b.priority] ?? 2));

    const list = document.getElementById("list");
    const empty = document.getElementById("emptyState");
    if (rows.length === 0) {
      list.innerHTML = "";
      empty.hidden = false;
    } else {
      empty.hidden = true;
      list.innerHTML = rows.map(renderRow).join("");
    }
  }

  document.getElementById("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    currentFilter = btn.dataset.filter;
    applyFilter();
  });

  document.getElementById("searchBox").addEventListener("input", (e) => {
    currentQuery = e.target.value.trim();
    applyFilter();
  });

  renderKpis();
  applyFilter();
</script>
