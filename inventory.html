<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>첫맛 재고 트래커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface-sunken: #f0efec;
    --ink: #1e1e1c;
    --ink-soft: #63615b;
    --ink-faint: #97948c;
    --border: #e2e0da;
    --accent: #2f6690;
    --accent-soft: #dfe9f0;
    --ok: #2f7a4f;
    --ok-soft: #e3f0e7;
    --warn: #a3760f;
    --warn-soft: #faf0d9;
    --danger: #b23a2e;
    --danger-soft: #f7e3e0;
    --info: #5b4a9c;
    --info-soft: #eae5f5;
    --shadow: 0 1px 2px rgba(30,30,28,0.04), 0 6px 20px -10px rgba(30,30,28,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f; --surface: #201c16; --surface-sunken: #292420;
      --ink: #efece4; --ink-soft: #b3aca0; --ink-faint: #777165; --border: #38322a;
      --accent: #7fb0d9; --accent-soft: #1c2e3a;
      --ok: #6fbf8c; --ok-soft: #1e2c22; --warn: #d9ac4c; --warn-soft: #332a14;
      --danger: #e0847a; --danger-soft: #35211d;
      --info: #a99ce0; --info-soft: #2a2440;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -10px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f; --surface: #201c16; --surface-sunken: #292420;
    --ink: #efece4; --ink-soft: #b3aca0; --ink-faint: #777165; --border: #38322a;
    --accent: #7fb0d9; --accent-soft: #1c2e3a;
    --ok: #6fbf8c; --ok-soft: #1e2c22; --warn: #d9ac4c; --warn-soft: #332a14;
    --danger: #e0847a; --danger-soft: #35211d;
    --info: #a99ce0; --info-soft: #2a2440;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px -10px rgba(0,0,0,0.6);
  }

  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 14.5px; line-height: 1.55;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #login-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 36px 32px; width: 320px; box-shadow: var(--shadow);
  }
  .login-card h1 { font-size: 17px; margin: 0 0 4px; }
  .login-card p { font-size: 12.5px; color: var(--ink-faint); margin: 0 0 20px; }
  .login-card input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-sunken); color: var(--ink); font-size: 14px;
  }
  .login-card button {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 6px;
  }
  #login-error { color: var(--danger); font-size: 12.5px; margin-top: 8px; display: none; }

  #app { display: none; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  header.top h1 { font-size: 19px; margin: 0; }
  header.top .sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .logout-btn { font-size: 12px; color: var(--ink-faint); background: none; border: 1px solid var(--border); border-radius: 100px; padding: 5px 12px; cursor: pointer; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
  .tab-btn {
    padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--ink-soft);
    background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
  .stat {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 16px;
    box-shadow: var(--shadow); cursor: pointer; text-align: left; font-family: inherit;
  }
  .stat .label { font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .03em; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .stat.active { border-color: var(--accent); }
  @media (max-width: 720px) { .stat-row { grid-template-columns: repeat(2,1fr); } }

  .brand-row { display: flex; gap: 6px; margin-bottom: 16px; }
  .brand-btn {
    font-size: 13px; font-weight: 600; padding: 7px 16px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-soft); cursor: pointer;
  }
  .brand-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .search-input {
    flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); font-size: 13.5px;
  }
  .filter-chip {
    font-size: 12.5px; padding: 5px 11px; border-radius: 100px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-soft); cursor: pointer;
  }
  .filter-chip.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }

  .upload-box {
    border: 1.5px dashed var(--border); border-radius: 12px; padding: 20px; text-align: center;
    background: var(--surface); margin-bottom: 18px;
  }
  .upload-box .btn {
    display: inline-block; background: var(--accent); color: #fff; font-weight: 600; font-size: 13.5px;
    padding: 9px 18px; border-radius: 8px; cursor: pointer; border: none;
  }
  .upload-box input[type=file] { display: none; }
  .upload-box .hint { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint);
    background: var(--surface-sunken); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-sunken); }

  .pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 100px; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }
  .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.neutral { background: var(--surface-sunken); color: var(--ink-faint); }

  .batch-card {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px;
  }
  .batch-card .meta { font-size: 12.5px; color: var(--ink-faint); }
  .batch-card .name { font-weight: 600; font-size: 13.5px; }
  .del-btn { font-size: 12px; color: var(--danger); background: none; border: 1px solid var(--border); border-radius: 100px; padding: 4px 12px; cursor: pointer; }

  .empty { text-align: center; color: var(--ink-faint); font-size: 13px; padding: 28px 0; }
  .save-status { position: fixed; bottom: 18px; right: 18px; font-size: 12px; color: var(--ink-faint); background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 100px; box-shadow: var(--shadow); opacity: 0; transition: opacity .3s; }
  .save-status.show { opacity: 1; }

  .edit-expiry-link { font-size: 11.5px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; margin-left: 2px; text-decoration: underline; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,18,14,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal-card { background: var(--surface); border-radius: 14px; padding: 24px; width: 380px; max-width: calc(100vw - 40px); box-shadow: var(--shadow); }
  .modal-card h3 { margin: 0 0 2px; font-size: 15.5px; }
  .modal-card .modal-sub { font-size: 12px; color: var(--ink-faint); margin-bottom: 16px; }
  .lot-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .lot-row .lot-date { font-family: "JetBrains Mono", monospace; font-size: 13px; flex: 1; }
  .lot-row .lot-qty { font-size: 12px; color: var(--ink-faint); }
  .lot-remove { font-size: 15px; color: var(--danger); background: none; border: none; cursor: pointer; padding: 2px 6px; }
  .lot-empty { font-size: 12.5px; color: var(--ink-faint); padding: 10px 0; }
  .lot-add-row { display: flex; gap: 6px; margin-top: 14px; }
  .lot-add-row input {
    padding: 7px 9px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-sunken); color: var(--ink); font-size: 13px;
  }
  .lot-add-row input.date-input { flex: 1.4; }
  .lot-add-row input.qty-input { flex: 1; }
  .lot-add-row button { padding: 7px 14px; border-radius: 7px; border: none; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
  .modal-close { width: 100%; margin-top: 16px; padding: 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); font-size: 13.5px; cursor: pointer; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>첫맛 재고 트래커</h1>
    <p>담당자 계정으로 로그인해주세요.</p>
    <input id="login-id" type="text" placeholder="아이디" autocomplete="off">
    <input id="login-pw" type="password" placeholder="비밀번호">
    <button id="login-btn">로그인</button>
    <div id="login-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <header class="top">
      <div>
        <h1>첫맛 재고 트래커</h1>
        <div class="sub" id="last-updated">불러오는 중...</div>
      </div>
      <button class="logout-btn" id="logout-btn">로그아웃</button>
    </header>

    <div class="brand-row" id="brand-row">
      <button class="brand-btn active" data-brand="all">전체</button>
      <button class="brand-btn" data-brand="첫맛">첫맛</button>
      <button class="brand-btn" data-brand="저스톡">저스톡</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="stock">첫맛 현재고</button>
      <button class="tab-btn" data-tab="outbound">출고내역 관리</button>
      <button class="tab-btn" data-tab="inbound">입고내역 관리</button>
    </div>

    <section class="tab-panel active" id="panel-stock">
      <div class="stat-row" id="stock-stats"></div>

      <div class="upload-box">
        <label class="btn" for="baseline-file">기초재고 새로 설정 (이지어드민 현재고 엑셀 업로드)</label>
        <input type="file" id="baseline-file" accept=".xls,.xlsx">
        <div class="hint">새로 업로드하면 그 시점 기준으로 초기화되고, 이후 출고/입고 내역이 여기에 누적 반영됩니다.</div>
      </div>

      <div class="toolbar">
        <input class="search-input" id="stock-search" placeholder="상품명 또는 바코드 검색">
        <button class="filter-chip sort-chip active" data-sort="remaining">재고 적은순</button>
        <button class="filter-chip sort-chip" data-sort="expiry">소비기한 빠른순</button>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>상태</th><th>상품명</th><th>바코드</th><th>기초재고</th><th>누적출고</th><th>누적입고</th><th>현재고</th><th>소비기한(로트별)</th></tr>
          </thead>
          <tbody id="stock-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="tab-panel" id="panel-outbound">
      <div class="upload-box">
        <label class="btn" for="outbound-file">출고 엑셀 첨부</label>
        <input type="file" id="outbound-file" accept=".xls,.xlsx">
        <div class="hint">더존 출고현황 엑셀을 그대로 업로드하세요. 업로드할 때마다 누적됩니다.</div>
      </div>
      <div id="outbound-list"></div>
    </section>

    <section class="tab-panel" id="panel-inbound">
      <div class="upload-box">
        <label class="btn" for="inbound-file">입고 엑셀 첨부</label>
        <input type="file" id="inbound-file" accept=".xls,.xlsx">
        <div class="hint">재고이동전표(전체 입고 수량 시트) 또는 개별 입고 엑셀을 업로드하세요.</div>
      </div>
      <div id="inbound-list"></div>
    </section>
  </div>
</div>

<div class="save-status" id="save-status">저장됨</div>

<div class="modal-overlay" id="expiry-modal" hidden>
  <div class="modal-card">
    <h3 id="expiry-modal-title">소비기한 관리</h3>
    <div class="modal-sub" id="expiry-modal-sub"></div>
    <div id="expiry-lot-list"></div>
    <div class="lot-add-row">
      <input type="text" id="expiry-new-date" class="date-input" placeholder="YY.MM.DD (예: 27.03.15)">
      <input type="number" id="expiry-new-qty" class="qty-input" placeholder="수량(선택)">
      <button type="button" id="expiry-add-btn">추가</button>
    </div>
    <button type="button" class="modal-close" id="expiry-modal-close">닫기</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var LOGIN_ID = "echungwoo";
  var LOGIN_PW = "dlcjddn1004!";

  // 저장은 Cloudflare Worker를 통해서만 이루어짐 (GitHub 토큰은 Worker 서버 쪽 비밀변수로만 존재,
  // 이 페이지 코드에는 전혀 노출되지 않음)
  var WORKER_URL = "https://cheotmat-inventory-api.ecw-c18.workers.dev";

  var state = { baseline: null, outboundBatches: [], inboundBatches: [] };

  // 단종상품 - 현재고 계산에서 완전히 제외
  var EXCLUDED_NAMES = [
    "첫맛 1호 선물세트 개별세트",
    "첫맛 꼬지소스 순한맛 460g",
    "첫맛 닭강정매운맛소스 10kg",
    "첫맛 떡볶이양념 10kg",
    "첫맛 양념치킨매운맛소스 440g",
    "첫맛 캡사이신매운맛소스 10kg",
    "첫맛 선물세트 6개입 카톤",
    "양꼬치시즈닝",
    "첫맛 꼬지소스 매운맛 460g",
  ];

      var json = await res.json();

  function findCol(header, candidates) {

    reader.onload = function (e) {

  function parseBaseline(wb) {
    var rows = sheetRows(wb);
    var header = rows[0] || [];
    var idx = {
      barcode: findCol(header, ["바코드"]), name: findCol(header, ["상품명"]), qty: findCol(header, ["가용재고"]),
      warn: findCol(header, ["경고수량"]), danger: findCol(header, ["위험수량"]),
    };
    if (idx.barcode === -1 || idx.qty === -1) throw new Error("이지어드민 현재고 형식이 맞는지 확인해주세요 (바코드/가용재고 컬럼을 못 찾음)");
    var items = {};
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i]; var barcode = r[idx.barcode];
      if (!barcode) continue;
      items[String(barcode)] = {
        name: idx.name !== -1 ? (r[idx.name] || "") : "",
        qty: Number(r[idx.qty]) || 0,
        warnQty: idx.warn !== -1 ? (Number(r[idx.warn]) || 0) : 0,
        dangerQty: idx.danger !== -1 ? (Number(r[idx.danger]) || 0) : 0,
      };

    return items;
  }
  function parseOutbound(wb) {
    var rows = sheetRows(wb);
    var header = rows[0] || [];
    var idx = { barcode: findCol(header, ["품번"]), name: findCol(header, ["품명"]), qty: findCol(header, ["출고수량"]), date: findCol(header, ["출고일자"]) };
    if (idx.barcode === -1 || idx.qty === -1) throw new Error("출고 엑셀 형식이 맞는지 확인해주세요 (품번/출고수량 컬럼을 못 찾음)");
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i]; var barcode = r[idx.barcode];
      if (!barcode) continue;
      out.push({ barcode: String(barcode), name: idx.name !== -1 ? (r[idx.name] || "") : "", qty: Number(r[idx.qty]) || 0, date: idx.date !== -1 ? (r[idx.date] || "") : "" });

    return out;

  function parseInbound(wb) {
    var sheetName = wb.SheetNames.indexOf("전체 입고 수량") !== -1 ? "전체 입고 수량" : wb.SheetNames[0];
    var rows = sheetRows(wb, sheetName);
    var header = rows[0] || [];
    var idx = {
      barcode: findCol(header, ["품  번", "품번"]), name: findCol(header, ["품  명", "품명"]),
      qty: findCol(header, ["이동수량"]), expiry: findCol(header, ["소비기한"]), date: findCol(header, ["No.", "No"]),
    };
    if (idx.barcode === -1 || idx.qty === -1) throw new Error("입고 엑셀 형식이 맞는지 확인해주세요 (품번/이동수량 컬럼을 못 찾음)");
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i]; var barcode = r[idx.barcode];
      if (!barcode) continue;
      out.push({ barcode: String(barcode), name: idx.name !== -1 ? (r[idx.name] || "") : "", qty: Number(r[idx.qty]) || 0, expiry: idx.expiry !== -1 ? (r[idx.expiry] || "") : "", date: idx.date !== -1 ? (r[idx.date] || "") : "" });
    }

  }

  // ---------- 계산 ----------
  var currentFilter = "all", currentSearch = "", currentSort = "remaining", currentBrand = "all";

  function computeStock() {
    var map = {};
    if (!state.baseline) return [];
    Object.keys(state.baseline.items).forEach(function (barcode) {
      var b = state.baseline.items[barcode];
      map[barcode] = { barcode: barcode, name: b.name, baseline: b.qty, warnQty: b.warnQty, dangerQty: b.dangerQty, outbound: 0, inbound: 0, expiries: [] };
    });
    state.outboundBatches.forEach(function (batch) {
      batch.rows.forEach(function (r) {
        if (!map[r.barcode]) map[r.barcode] = { barcode: r.barcode, name: r.name, baseline: 0, warnQty: 0, dangerQty: 0, outbound: 0, inbound: 0, expiries: [] };
        map[r.barcode].outbound += r.qty;
        if (r.name && !map[r.barcode].name) map[r.barcode].name = r.name;
      });
    });
    state.inboundBatches.forEach(function (batch) {
      batch.rows.forEach(function (r) {
        if (!map[r.barcode]) map[r.barcode] = { barcode: r.barcode, name: r.name, baseline: 0, warnQty: 0, dangerQty: 0, outbound: 0, inbound: 0, expiries: [] };
        map[r.barcode].inbound += r.qty;
        if (r.name && !map[r.barcode].name) map[r.barcode].name = r.name;
        if (r.expiry) map[r.barcode].expiries.push({ date: r.expiry, qty: r.qty });
      });
    });
    var list = Object.keys(map)
      .filter(function (k) { return EXCLUDED_NAMES.indexOf(map[k].name) === -1; })
      .map(function (k) {
        var v = map[k];
        v.remaining = v.baseline - v.outbound + v.inbound;
        if (v.remaining <= 0) v.status = "danger";
        else if (v.dangerQty > 0 && v.remaining <= v.dangerQty) v.status = "danger";
        else if (v.warnQty > 0 && v.remaining <= v.warnQty) v.status = "warn";
        else v.status = "ok";

        // 화면에서 직접 관리하는 소비기한(state.manualExpiry)이 있으면 그게 우선 (없으면 입고 엑셀 기준 유지)
        if (state.manualExpiry && state.manualExpiry[v.barcode] !== undefined) {
          v.expiries = state.manualExpiry[v.barcode].slice();
        }
        v.expiries.sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
        v.nearestExpiryDays = v.expiries.length ? expiryDays(v.expiries[0].date) : null;
        return v;
      });
    if (currentSort === "expiry") {
      list.sort(function (a, b) {
        var da = a.nearestExpiryDays, db = b.nearestExpiryDays;
        if (da === null && db === null) return 0;
        if (da === null) return 1;
        if (db === null) return -1;
        return da - db;
      });
    } else {
      list.sort(function (a, b) { return a.remaining - b.remaining; });
    }
    return list;
  }

  function expiryDays(expiryStr) {
    var m = String(expiryStr).match(/(\d{2})\.(\d{2})\.(\d{2})/);
    if (!m) return null;
    var d = new Date(2000 + parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
    return Math.round((d - new Date()) / (1000 * 3600 * 24));
  }
  function expiryTier(days) {
    if (days === null) return { cls: "neutral", label: "" };
    if (days <= 30) return { cls: "danger", label: "극임박" };
    if (days <= 90) return { cls: "warn", label: "초임박" };
    if (days <= 180) return { cls: "info", label: "임박" };
    return { cls: "neutral", label: "정상" };
  }
  var JUSTOK_EXTRA_NAMES = ["양꼬치시즈닝"]; // 이름에 "저스톡"이 없지만 저스톡 브랜드로 분류할 품목
  function brandOf(name) {
    var n = String(name || "");
    if (n.indexOf("저스톡") !== -1) return "저스톡";
    if (JUSTOK_EXTRA_NAMES.indexOf(n) !== -1) return "저스톡";
    return "첫맛";
  }

  // ---------- 렌더 ----------
  function renderAll() {
    document.getElementById("last-updated").textContent = state.baseline
      ? "기초재고 기준일: " + state.baseline.setAt + " (" + state.baseline.fileName + ")"
      : "기초재고가 아직 설정되지 않았습니다";

    renderBatchList("outbound");

  function renderStock() {
    var all = computeStock();
    var byBrand = all.filter(function (i) { return currentBrand === "all" || brandOf(i.name) === currentBrand; });
    var total = byBrand.length;
    var dangerCount = byBrand.filter(function (i) { return i.status === "danger"; }).length;
    var warnCount = byBrand.filter(function (i) { return i.status === "warn"; }).length;
    var expiryCount = byBrand.filter(function (i) { return i.nearestExpiryDays !== null && i.nearestExpiryDays <= 180; }).length;

    document.getElementById("stock-stats").innerHTML =
      statCard("all", "전체 품목", total) +
      statCard("danger", "품절/위험", dangerCount, "danger") +
      statCard("warn", "경고", warnCount, "warn") +
      statCard("expiry", "소비기한 임박(6개월내)", expiryCount, "info");

    var filtered = byBrand.filter(function (item) {
      if (currentSearch && (item.name + item.barcode).toLowerCase().indexOf(currentSearch.toLowerCase()) === -1) return false;
      if (currentFilter === "danger") return item.status === "danger";
      if (currentFilter === "warn") return item.status === "warn";
      if (currentFilter === "expiry") return item.nearestExpiryDays !== null && item.nearestExpiryDays <= 180;
      return true;
    });

    var tbody = document.getElementById("stock-tbody");
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty">표시할 상품이 없습니다.' + (state.baseline ? "" : " 기초재고를 먼저 업로드해주세요.") + "</div></td></tr>";
      return;
    }
    tbody.innerHTML = filtered.map(function (item) {
      var expiryPill;
      if (item.expiries && item.expiries.length) {
        expiryPill = item.expiries.map(function (lot) {
          var d = expiryDays(lot.date);
          var tier = expiryTier(d);
          var dLabel = d === null ? "" : " (D" + (d >= 0 ? "-" + d : "+" + -d) + ")";
          var tierLabel = tier.label ? tier.label + " " : "";
          var qtyLabel = lot.qty === null || lot.qty === undefined ? "" : " · " + lot.qty + "개";
          return '<span class="pill ' + tier.cls + '" style="margin:1px 3px 1px 0;">' + tierLabel + lot.date + dLabel + qtyLabel + "</span>";
        }).join("");
      } else {
        expiryPill = '<span class="pill neutral">-</span>';
      }
      expiryPill += '<button type="button" class="edit-expiry-link" data-edit-expiry="' + item.barcode + '">수정</button>';
      var statusLabel = item.status === "danger" ? "품절/위험" : item.status === "warn" ? "경고" : "정상";
      return "<tr>" +
        '<td><span class="pill ' + item.status + '">' + statusLabel + "</span></td>" +
        "<td>" + escapeHtml(item.name || "(이름없음)") + "</td>" +
        '<td class="mono">' + item.barcode + "</td>" +
        '<td class="mono">' + item.baseline + "</td>" +
        '<td class="mono">' + item.outbound + "</td>" +
        '<td class="mono">' + item.inbound + "</td>" +
        '<td class="mono"><strong>' + item.remaining + "</strong></td>" +
        "<td>" + expiryPill + "</td>" +
        "</tr>";
    }).join("");
  }

  function statCard(filterKey, label, value, tone) {
    var color = tone === "danger" ? "var(--danger)" : tone === "warn" ? "var(--warn)" : tone === "info" ? "var(--info)" : "var(--ink)";
    var active = currentFilter === filterKey ? " active" : "";
    return '<button type="button" class="stat' + active + '" data-filter="' + filterKey + '"><div class="label">' + label +
      '</div><div class="value" style="color:' + color + '">' + value + "</div></button>";
  }

  function renderBatchList(kind) {
    var batches = kind === "outbound" ? state.outboundBatches : state.inboundBatches;
    var container = document.getElementById(kind + "-list");
    if (batches.length === 0) { container.innerHTML = '<div class="empty">아직 첨부된 파일이 없습니다.</div>'; return; }
    var sorted = batches.slice().reverse();
    container.innerHTML = sorted.map(function (b) {
      return '<div class="batch-card"><div><div class="name">' + escapeHtml(b.fileName) + '</div>' +
        '<div class="meta">첨부일 ' + b.uploadedAt + " · 품목 " + b.rows.length + "건 · 합계수량 " + b.totalQty + '건</div></div>' +
        '<button class="del-btn" data-kind="' + kind + '" data-id="' + b.id + '">삭제</button></div>';
    }).join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }

  // ---------- 소비기한 편집 모달 ----------
  var editingBarcode = null;

  function openExpiryModal(barcode) {
    editingBarcode = barcode;
    if (!state.manualExpiry) state.manualExpiry = {};
    if (!state.manualExpiry[barcode]) state.manualExpiry[barcode] = [];
    var stock = computeStock();
    var item = stock.filter(function (i) { return i.barcode === barcode; })[0];
    document.getElementById("expiry-modal-sub").textContent = (item ? item.name : barcode) + " (" + barcode + ")";
    renderExpiryModalList();
    document.getElementById("expiry-new-date").value = "";
    document.getElementById("expiry-new-qty").value = "";
    document.getElementById("expiry-modal").hidden = false;
  }

  function closeExpiryModal() {
    document.getElementById("expiry-modal").hidden = true;
    editingBarcode = null;
    renderStock();
  }

  function renderExpiryModalList() {
    var lots = (state.manualExpiry[editingBarcode] || []).slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    var list = document.getElementById("expiry-lot-list");
    if (lots.length === 0) {
      list.innerHTML = '<div class="lot-empty">등록된 소비기한이 없습니다.</div>';
      return;
    }
    list.innerHTML = lots.map(function (lot, i) {
      return '<div class="lot-row"><span class="lot-date">' + lot.date + '</span>' +
        '<span class="lot-qty">' + (lot.qty === null || lot.qty === undefined ? "" : lot.qty + "개") + '</span>' +
        '<button type="button" class="lot-remove" data-remove-lot="' + i + '">×</button></div>';
    }).join("");
  }

  function isValidDateStr(s) {
    return /^\d{2}\.\d{2}\.\d{2}$/.test(s);
  }

  document.getElementById("expiry-add-btn").addEventListener("click", function () {
    var dateVal = document.getElementById("expiry-new-date").value.trim();
    var qtyVal = document.getElementById("expiry-new-qty").value.trim();
    if (!isValidDateStr(dateVal)) { alert("날짜는 YY.MM.DD 형식으로 입력해주세요 (예: 27.03.15)"); return; }
    state.manualExpiry[editingBarcode].push({ date: dateVal, qty: qtyVal ? Number(qtyVal) : null });
    document.getElementById("expiry-new-date").value = "";
    document.getElementById("expiry-new-qty").value = "";
    renderExpiryModalList();
    persist();
  });

  document.getElementById("expiry-modal-close").addEventListener("click", closeExpiryModal);

  document.getElementById("expiry-lot-list").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-remove-lot]");
    if (!btn || !editingBarcode) return;
    var idx = Number(btn.dataset.removeLot);
    var lots = state.manualExpiry[editingBarcode].slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    var target = lots[idx];
    var realIdx = state.manualExpiry[editingBarcode].indexOf(target);
    if (realIdx !== -1) state.manualExpiry[editingBarcode].splice(realIdx, 1);
    renderExpiryModalList();
    persist();
  });

  // ---------- 이벤트 ----------
  document.querySelectorAll(".tab-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".tab-btn").forEach(function (b) { b.classList.remove("active"); });
      document.querySelectorAll(".tab-panel").forEach(function (p) { p.classList.remove("active"); });
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });
  document.querySelectorAll(".brand-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".brand-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentBrand = btn.dataset.brand;
      renderStock();
    });
  });
  document.querySelectorAll(".sort-chip").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".sort-chip").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentSort = btn.dataset.sort;
      renderStock();
    });
  });
  document.getElementById("stock-search").addEventListener("input", function (e) { currentSearch = e.target.value; renderStock(); });

  document.getElementById("baseline-file").addEventListener("change", function (e) {
    var file = e.target.files[0]; if (!file) return;
    readWorkbookFromFile(file, function (wb) {
      try {
        var items = parseBaseline(wb);
        state.baseline = { setAt: todayLabel(), fileName: file.name, items: items };
        state.outboundBatches = []; state.inboundBatches = [];
        renderAll(); persist();
      } catch (err) { alert(err.message); }
    });
    e.target.value = "";
  });
  document.getElementById("outbound-file").addEventListener("change", function (e) {
    var file = e.target.files[0]; if (!file) return;
    readWorkbookFromFile(file, function (wb) {
      try {
        var rows = parseOutbound(wb);
        var total = rows.reduce(function (s, r) { return s + r.qty; }, 0);
        state.outboundBatches.push({ id: uid(), uploadedAt: todayLabel(), fileName: file.name, rows: rows, totalQty: total });
        renderAll(); persist();
      } catch (err) { alert(err.message); }
    });
    e.target.value = "";
  });
  document.getElementById("inbound-file").addEventListener("change", function (e) {
    var file = e.target.files[0]; if (!file) return;
    readWorkbookFromFile(file, function (wb) {
      try {
        var rows = parseInbound(wb);
        var total = rows.reduce(function (s, r) { return s + r.qty; }, 0);
        state.inboundBatches.push({ id: uid(), uploadedAt: todayLabel(), fileName: file.name, rows: rows, totalQty: total });
        renderAll(); persist();
      } catch (err) { alert(err.message); }
    });
    e.target.value = "";
  });

  document.body.addEventListener("click", function (e) {
    if (e.target.classList.contains("del-btn")) {
      var kind = e.target.dataset.kind, id = e.target.dataset.id;
      var key = kind === "outbound" ? "outboundBatches" : "inboundBatches";
      state[key] = state[key].filter(function (b) { return b.id !== id; });
      renderAll(); persist();
      return;
    }
    var statBtn = e.target.closest(".stat[data-filter]");
    if (statBtn) { currentFilter = statBtn.dataset.filter; renderStock(); return; }
    var editBtn = e.target.closest("[data-edit-expiry]");
    if (editBtn) { openExpiryModal(editBtn.dataset.editExpiry); }
  });
})();
</script>
</body>
</html>
