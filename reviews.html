<style>
  :root {
    --bg: #0A1122;
    --surface: #10192F;
    --surface-2: #15213C;
    --border: #253150;
    --text: #E8EDFC;
    --text-muted: #8D98B8;
    --text-muted-2: #5B6580;
    --accent: #1957E8;
    --up: #4FD891;
    --down: #FF6B6B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 24px 64px; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "맑은 고딕", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
  @media (max-width: 720px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .chart-title { font-size: 14px; font-weight: 600; color: var(--text); margin: 0 0 2px; }
  .chart-sub { font-size: 12px; color: var(--text-muted-2); margin: 0 0 14px; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; min-height: 26px; }
  .bar-label {
    width: 54%; flex-shrink: 0; font-size: 12px; line-height: 1.35; color: var(--text-muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bar-track { flex: 1; height: 18px; background: var(--surface-2); border-radius: 4px; position: relative; align-self: center; }
  .bar-fill { height: 18px; border-radius: 4px; min-width: 4px; }
  .bar-value {
    width: 52px; flex-shrink: 0; text-align: right; font-size: 12px;
    color: var(--text); font-variant-numeric: tabular-nums;
  }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { background: var(--surface-2); color: var(--text-muted); font-weight: 600; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-2); }
  a { color: var(--text); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .delta-up { color: var(--up); font-weight: 700; }
  .delta-down { color: var(--down); font-weight: 700; }
  .delta-flat { color: var(--text-muted); }
  .stars { color: #E0B84D; letter-spacing: 1px; }
  .rank { color: var(--text-muted); width: 32px; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  .sort-arrow { display: inline-block; width: 10px; color: var(--accent); }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; cursor: pointer; padding: 10px 16px; font-size: 14px;
    font-weight: 600; color: var(--text-muted); font-family: inherit;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-btn .badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 10px;
    background: var(--down); color: #1a0505; font-size: 11px; font-weight: 700;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .platform-tabs { margin-bottom: 24px; border-bottom-width: 1px; }
  .platform-tabs .tab-btn { font-size: 16px; padding: 12px 24px; }
  .platform-tabs .tab-btn.active { border-bottom-width: 3px; }
  .platform-panel { display: none; }
  .platform-panel.active { display: block; }

  .merge-empty { color: var(--text-muted); font-size: 14px; padding: 20px 4px; }
  .merge-card {
    background: var(--surface); border: 1px solid var(--warning, #E0B84D); border-radius: 12px;
    padding: 16px 20px; margin-bottom: 14px;
  }
  .merge-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .merge-warn-icon { color: #E0B84D; font-size: 16px; }
  .merge-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .merge-sub { font-size: 12px; color: var(--text-muted-2); margin-left: 2px; }
  .merge-items { width: 100%; border-collapse: collapse; }
  .merge-items td { padding: 6px 8px; font-size: 13px; border-bottom: 1px solid var(--border); }
  .merge-items tr:last-child td { border-bottom: none; }
  .merge-count { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
</style>

const PLATFORM_LABEL = { coupang: "쿠팡 마이샵", smartstore: "스마트스토어" };

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function stripCount(name) {
  // "1개"/"3개" 같은 수량 표기는 같은 상품 리뷰 링크를 가리키는 부가정보일 뿐이라 뺀다.
  return name
    .split(",")
    .map(s => s.trim())
    .filter(s => !/^\d+개$/.test(s))
    .join(", ");
}

function starText(rating) {
  if (rating === null || rating === undefined || rating === "") return "-";
  const r = parseFloat(rating);
  const full = Math.floor(r);
  const half = (r - full) >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return "★".repeat(full) + (half ? "⯨" : "") + "☆".repeat(empty) + ` (${r.toFixed(1)})`;
}

function deltaText(delta) {
  if (delta === null || delta === undefined) return '<span class="delta-flat">신규</span>';
  if (delta > 0) return `<span class="delta-up">+${delta}</span>`;
  if (delta < 0) return `<span class="delta-down">${delta}</span>`;
  return '<span class="delta-flat">0</span>';
}

function renderBarChart(containerId, items, color) {
  const container = document.getElementById(containerId);
  if (items.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted-2);font-size:12px;">데이터 없음</p>';
    return;
  }
  const max = Math.max(...items.map(i => i.review_count), 1);
  container.innerHTML = items.map(item => {
    const pct = Math.max((item.review_count / max) * 100, 2);
    // 전부 "첫맛"으로 시작해서 중복 정보라 차트 라벨에선 빼고, 전체 이름은 title(호버)로 남긴다.
    const shortName = stripCount(item.name.replace(/^첫맛\s*/, ""));
    return `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml(item.name)}">${escapeHtml(shortName)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <div class="bar-value">${item.review_count.toLocaleString()}</div>
      </div>`;
  }).join("");
}

// 정렬 상태: key가 null이면 서버가 준 원래 순서(증가량 내림차순) 그대로 보여준다.
// 숫자 컬럼(리뷰수/별점)은 처음 클릭하면 큰 값부터, 상품명은 처음 클릭하면 가나다순.
// 플랫폼(쿠팡/스마트스토어)별로 독립된 정렬 상태를 갖는다.
const sortStates = { coupang: { key: null, dir: 1 }, smartstore: { key: null, dir: 1 } };
const DEFAULT_DIR = { name: 1, review_count: -1, rating: -1, delta: -1 };

function sortValue(row, key) {
  if (key === "name") return row.name || "";
  if (key === "rating") return (row.rating === "" || row.rating === null || row.rating === undefined) ? -1 : parseFloat(row.rating);
  if (key === "delta") return (row.delta === null || row.delta === undefined) ? -Infinity : row.delta;
  return row.review_count;
}

// 스마트스토어는 상품명에 용량 표기가 콤마로 분리돼 있지 않아 결합 후보 탐지 자체가
// 의미 없고, 필요하지도 않다고 해서 "상품결합필요" 탭은 쿠팡에서만 보여준다.
const SHOW_MERGE = { coupang: true, smartstore: false };

function panelTemplate(key) {
  const checkedAt = DATA[key].checked_at || "아직 확인된 이력 없음";
  const showMerge = SHOW_MERGE[key];
  const tabsBar = showMerge ? `
    <div class="tabs">
      <button class="tab-btn active" data-tab="all">전체 현황</button>
      <button class="tab-btn" data-tab="merge">상품결합필요<span class="badge" id="merge-badge-${key}" style="display:none;"></span></button>
    </div>` : "";
  const mergePanel = showMerge ? `
    <div class="tab-panel" id="tab-merge-${key}">
      <p class="chart-sub" style="margin-bottom:16px;">같은 상품인데 용량(옵션)별로 리뷰수가 다르게 나오는 그룹 - 옵션으로 안 묶이고 별도 상품으로 등록돼 있다는 뜻으로, 결합 요청 대상입니다.</p>
      <div id="merge-list-${key}"></div>
    </div>` : "";
  return `
    <div class="sub">${PLATFORM_LABEL[key]} 전체 품목 · 마지막 확인: ${checkedAt} · 증가량 = 직전 조회 대비</div>
    ${tabsBar}
    <div class="tab-panel active" id="tab-all-${key}">
      <div class="chart-grid">
        <div class="chart-card">
          <p class="chart-title">리뷰 많은 TOP 10</p>
          <p class="chart-sub">현재 리뷰수 기준</p>
          <div id="chart-top-${key}"></div>
        </div>
        <div class="chart-card">
          <p class="chart-title">리뷰 적은 TOP 10</p>
          <p class="chart-sub">마케팅 필요 후보</p>
          <div id="chart-bottom-${key}"></div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th class="rank">#</th>
            <th class="sortable" data-key="name">상품명<span class="sort-arrow" data-arrow="name"></span></th>
            <th class="num sortable" data-key="review_count">리뷰수<span class="sort-arrow" data-arrow="review_count"></span></th>
            <th class="num sortable" data-key="delta">증가량<span class="sort-arrow" data-arrow="delta"></span></th>
            <th class="sortable" data-key="rating">별점<span class="sort-arrow" data-arrow="rating"></span></th>
            <th>마지막 확인</th>
          </tr>
        </thead>
        <tbody id="rows-${key}"></tbody>
      </table>
    </div>
    ${mergePanel}
  `;
}

function renderTable(key) {
  const tbody = document.getElementById(`rows-${key}`);
  const state = sortStates[key];
  let rows = [...DATA[key].rows];
  if (state.key) {
    rows.sort((a, b) => {
      const va = sortValue(a, state.key), vb = sortValue(b, state.key);
      const cmp = typeof va === "string" ? va.localeCompare(vb, "ko") : (va - vb);
      return cmp * state.dir;
    });
  }
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">데이터 없음</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map((row, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td><a href="${row.url}" target="_blank" rel="noopener" title="${escapeHtml(row.name)}">${escapeHtml(stripCount(row.name))}</a></td>
      <td class="num">${row.review_count.toLocaleString()}</td>
      <td class="num">${deltaText(row.delta)}</td>
      <td class="stars">${starText(row.rating)}</td>
      <td>${row.checked_at}</td>
    </tr>`).join("");
}

function updateSortArrows(key, root) {
  root.querySelectorAll(".sort-arrow").forEach(el => {
    el.textContent = el.dataset.arrow === sortStates[key].key ? (sortStates[key].dir === 1 ? "▲" : "▼") : "";
  });
}

function renderMergeList(key) {
  const container = document.getElementById(`merge-list-${key}`);
  const badge = document.getElementById(`merge-badge-${key}`);
  const mergeData = DATA[key].merge;
  if (mergeData.length === 0) {
    container.innerHTML = '<p class="merge-empty">결합이 필요한 상품이 없습니다.</p>';
    badge.style.display = "none";
    return;
  }
  badge.textContent = mergeData.length;
  badge.style.display = "inline-block";
  container.innerHTML = mergeData.map(group => `
    <div class="merge-card">
      <div class="merge-head">
        <span class="merge-warn-icon">⚠</span>
        <span class="merge-title">${escapeHtml(group.base_name)}</span>
        <span class="merge-sub">옵션 ${group.items.length}개 · 리뷰수 불일치</span>
      </div>
      <table class="merge-items">
        ${group.items.map(item => `
          <tr>
            <td><a href="${item.url}" target="_blank" rel="noopener" title="${escapeHtml(item.name)}">${escapeHtml(stripCount(item.name))}</a></td>
            <td class="merge-count">${item.review_count.toLocaleString()}</td>
          </tr>`).join("")}
      </table>
    </div>`).join("");
}

function setupPlatform(key) {
  const panel = document.querySelector(`.platform-panel[data-platform="${key}"]`);
  panel.innerHTML = panelTemplate(key);

  const rows = DATA[key].rows;
  const byCountDesc = [...rows].sort((a, b) => b.review_count - a.review_count);
  const byCountAsc = [...rows].sort((a, b) => a.review_count - b.review_count);
  renderBarChart(`chart-top-${key}`, byCountDesc.slice(0, 10), "var(--up)");
  renderBarChart(`chart-bottom-${key}`, byCountAsc.slice(0, 10), "var(--down)");

  renderTable(key);
  if (SHOW_MERGE[key]) renderMergeList(key);

  panel.querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.key;
      const state = sortStates[key];
      if (state.key === k) {
        state.dir *= -1;
      } else {
        state.key = k;
        state.dir = DEFAULT_DIR[k];
      }
      renderTable(key);
      updateSortArrows(key, panel);
    });
  });

  panel.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      panel.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      panel.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      panel.querySelector(`#tab-${btn.dataset.tab}-${key}`).classList.add("active");
    });
  });
}

setupPlatform("coupang");
setupPlatform("smartstore");

document.querySelectorAll(".platform-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".platform-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".platform-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.querySelector(`.platform-panel[data-platform="${btn.dataset.platform}"]`).classList.add("active");
  });
});
</script>
</body>
