function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function starText(rating) {
  if (rating === null || rating === undefined || rating === "") return "-";
  const r = parseFloat(rating);
  const full = Math.floor(r);
  const half = (r - full) >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return "★".repeat(full) + (half ? "⯨" : "") + "☆".repeat(empty) + ` (${r.toFixed(1)})`;
}

function deltaText(delta) {
  if (delta === null || delta === undefined) return '<span class="delta-flat">신규</span>';
  if (delta > 0) return `<span class="delta-up">+${delta}</span>`;
  if (delta < 0) return `<span class="delta-down">${delta}</span>`;
  return '<span class="delta-flat">0</span>';
}

    return;
  }

    const pct = Math.max((item.review_count / max) * 100, 2);

    const shortName = item.name.replace(/^첫맛\s*/, "");
    return `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml(item.name)}">${escapeHtml(shortName)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
        <div class="bar-value">${item.review_count.toLocaleString()}</div>
      </div>`;
  }).join("");
}

const byCountDesc = [...DATA].sort((a, b) => b.review_count - a.review_count);
const byCountAsc = [...DATA].sort((a, b) => a.review_count - b.review_count);
renderBarChart("chart-top", byCountDesc.slice(0, 10), "var(--up)");
renderBarChart("chart-bottom", byCountAsc.slice(0, 10), "var(--down)");

// 정렬 상태: key가 null이면 서버가 준 원래 순서(증가량 내림차순) 그대로 보여준다.
// 숫자 컬럼(리뷰수/별점)은 처음 클릭하면 큰 값부터, 상품명은 처음 클릭하면 가나다순.
const sortState = { key: null, dir: 1 };
const DEFAULT_DIR = { name: 1, review_count: -1, rating: -1, delta: -1 };

function sortValue(row, key) {
  if (key === "name") return row.name || "";
  if (key === "rating") return (row.rating === "" || row.rating === null || row.rating === undefined) ? -1 : parseFloat(row.rating);
  if (key === "delta") return (row.delta === null || row.delta === undefined) ? -Infinity : row.delta;
  return row.review_count;
}

function renderTable() {
  const tbody = document.getElementById("rows");
  let rows = [...DATA];
  if (sortState.key) {
    rows.sort((a, b) => {
      const va = sortValue(a, sortState.key), vb = sortValue(b, sortState.key);
      const cmp = typeof va === "string" ? va.localeCompare(vb, "ko") : (va - vb);
      return cmp * sortState.dir;
    });
  }
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">데이터 없음</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map((row, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td><a href="${row.url}" target="_blank" rel="noopener">${escapeHtml(row.name)}</a></td>
      <td class="num">${row.review_count.toLocaleString()}</td>
      <td class="num">${deltaText(row.delta)}</td>
      <td class="stars">${starText(row.rating)}</td>
      <td>${row.checked_at}</td>
    </tr>`).join("");
}

function updateSortArrows() {
  document.querySelectorAll(".sort-arrow").forEach(el => {
    el.textContent = el.dataset.arrow === sortState.key ? (sortState.dir === 1 ? "▲" : "▼") : "";
  });
}

document.querySelectorAll("th.sortable").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortState.key === key) {
      sortState.dir *= -1;
    } else {
      sortState.key = key;
      sortState.dir = DEFAULT_DIR[key];
    }
    renderTable();
    updateSortArrows();
  });
});

renderTable();
</script>
</body>
</html>
